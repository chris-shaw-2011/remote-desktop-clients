// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '2.2.21'
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    plugins.withId('com.android.application') {
        android {
            packaging {
                resources {
                    // BC 1.86-family modules ship the same license; retain one copy.
                    pickFirsts += ['META-INF/LICENSE.md']
                }
            }
        }
    }
    repositories {
        mavenCentral()
        google()
        flatDir {
            dirs project(':common').file('aars')
        }
    }
}

ext {
    toolsVersion = properties.get('TOOLS_VERSION', '35.0.0')
    compileApi = properties.get('COMPILE_API', 37)
    targetApi = properties.get('TARGET_API', 36)
    minApi = properties.get('MIN_API', 23)
}
