name: Build personal aRDP APK

on:
  push:
    branches:
      - master
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Commit to build after an automated upstream sync
        required: false
        type: string
      source_kind:
        description: Source description for the release notes
        required: false
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: write

concurrency:
  group: build-ardp-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Select source commit
        id: source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          INPUT_SOURCE_KIND: ${{ inputs.source_kind }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          source_sha="$INPUT_SOURCE_SHA"
          source_kind="$INPUT_SOURCE_KIND"
          publish=false

          if [[ -n "$source_sha" ]]; then
            publish=true
            source_kind="${source_kind:-upstream-sync}"
          else
            source_sha="$EVENT_SHA"
            case "$EVENT_NAME" in
              push)
                publish=true
                source_kind="fork push"
                ;;
              workflow_dispatch)
                source_kind="manual build"
                if [[ "$EVENT_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
                  publish=true
                fi
                ;;
              *)
                source_kind="${source_kind:-workflow build}"
                ;;
            esac
          fi

          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "kind=$source_kind" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install required Android SDK packages
        id: android-sdk
        shell: bash
        run: |
          set -euo pipefail

          compile_api=$(sed -n "s/.*compileApi = properties.get('COMPILE_API', \([0-9][0-9]*\)).*/\1/p" build.gradle)
          tools_version=$(sed -n "s/.*toolsVersion = properties.get('TOOLS_VERSION', '\([^']*\)').*/\1/p" build.gradle)
          if [[ -z "$compile_api" || -z "$tools_version" ]]; then
            echo "::error::Could not determine compileApi or toolsVersion from build.gradle"
            exit 1
          fi

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "::error::Neither ANDROID_SDK_ROOT nor ANDROID_HOME is set"
            exit 1
          fi

          sdkmanager_path=$(command -v sdkmanager || true)
          if [[ -z "$sdkmanager_path" ]]; then
            sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [[ ! -x "$sdkmanager_path" ]]; then
            echo "::error::sdkmanager was not found on PATH or under $sdk_root/cmdline-tools/latest/bin"
            exit 1
          fi

          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" \
            "platform-tools" \
            "platforms;android-$compile_api" \
            "build-tools;$tools_version"

          build_tools="$sdk_root/build-tools/$tools_version"
          for tool in aapt apksigner zipalign; do
            if [[ ! -x "$build_tools/$tool" ]]; then
              echo "::error::$tool was not found in $build_tools"
              exit 1
            fi
          done

          echo "build_tools=$build_tools" >> "$GITHUB_OUTPUT"

      - name: Prepare and patch native dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./download-prebuilt-dependencies.sh
          (
            cd remoteClientLib/jni/libs
            ANDROID_ABIS=arm64-v8a \
              FORCE_FREERDP_BUILD=true \
              ANDROID_SDK="$ANDROID_SDK_ROOT" \
              ./build-deps.sh -j "$(nproc)" freerdp
          )
          ./bVNC/prepare_project.sh --skip-build libs nopath

          freerdp_root="remoteClientLib/jni/libs/deps/FreeRDP"
          bookmark="$freerdp_root/client/Android/Studio/freeRDPCore/src/main/java/com/freerdp/freerdpcore/domain/BookmarkBase.java"
          libfreerdp_client="$freerdp_root/client/Android/Studio/freeRDPCore/src/main/jniLibs/arm64-v8a/libfreerdp-client2.so"
          if [[ ! -f "$bookmark" || ! -d "$freerdp_root/client/Android/Studio/freeRDPCore/src/main/jniLibs/arm64-v8a" ]]; then
            echo "::error::The patched FreeRDP dependency was not built correctly"
            exit 1
          fi

          grep -Fq 'void setGlyphCache(boolean glyphCache)' "$bookmark"
          grep -Fq 'args.add("/sound:latency:150")' \
            "$freerdp_root/client/Android/Studio/freeRDPCore/src/main/java/com/freerdp/freerdpcore/services/LibFreeRDP.java"
          grep -Faq 'Starting buffered OpenSL playback with %d ms prebuffer' "$libfreerdp_client"

      - name: Test concurrent RDP session routing
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :remoteClientLib:testDebugUnitTest

      - name: Build aRDP release APKs
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :aRDP-app:assembleRelease

      - name: Locate and validate unsigned ARM64 APK
        id: unsigned
        env:
          AAPT: ${{ steps.android-sdk.outputs.build_tools }}/aapt
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t candidates < <(find aRDP-app/build/outputs/apk/release -type f -name '*arm64-v8a*.apk' | sort)
          if [[ "${#candidates[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one ARM64 aRDP release APK, found ${#candidates[@]}"
            printf '%s\n' "${candidates[@]}"
            exit 1
          fi

          apk="${candidates[0]}"
          badging="$($AAPT dump badging "$apk")"
          application_id=$(sed -n "s/.*package: name='\([^']*\)'.*/\1/p" <<< "$badging")
          version_code=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$badging")
          version_name=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$badging")

          if [[ "$application_id" != "com.iiordanov.aRDP" ]]; then
            echo "::error::Unexpected application ID: $application_id"
            exit 1
          fi
          if [[ -z "$version_code" || -z "$version_name" ]]; then
            echo "::error::Could not read version information from the APK"
            exit 1
          fi

          manifest_tree="$RUNNER_TEMP/ardp-manifest-tree.txt"
          "$AAPT" dump xmltree "$apk" AndroidManifest.xml > "$manifest_tree"
          grid_manifest=$(sed -n '/ConnectionGridActivity/,/E: intent-filter/p' "$manifest_tree")
          canvas_manifest=$(sed -n '/RemoteCanvasActivity/,/E: intent-filter/p' "$manifest_tree")
          if ! grep -Eq 'android:launchMode.*0x2$' <<< "$grid_manifest" ||
             ! grep -Eq 'android:launchMode.*0x0$' <<< "$canvas_manifest" ||
             ! grep -Eq 'android:documentLaunchMode.*0x2$' <<< "$canvas_manifest" ||
             ! grep -Eq 'android:taskAffinity.*"com\.iiordanov\.aRDP\.rdpSession"' <<< "$canvas_manifest" ||
             ! grep -Eq 'android:resizeableActivity.*0xffffffff$' <<< "$canvas_manifest"; then
            echo "::error::aRDP launcher and canvas are not packaged as separate multi-document tasks"
            printf '%s\n' "$grid_manifest"
            printf '%s\n' "$canvas_manifest"
            exit 1
          fi

          zip_entries="$RUNNER_TEMP/ardp-zip-entries.txt"
          unzip -Z1 "$apk" > "$zip_entries"
          if ! grep -Eq '^lib/arm64-v8a/[^/]+\.so$' "$zip_entries"; then
            echo "::error::APK does not contain ARM64 native libraries"
            exit 1
          fi
          if grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/' "$zip_entries"; then
            echo "::error::ARM64 split unexpectedly contains another ABI"
            exit 1
          fi

          safe_version=$(sed 's/[^A-Za-z0-9._-]/-/g' <<< "$version_name" | tr -d '\n')
          short_sha=$(cut -c1-7 <<< "${{ steps.source.outputs.sha }}")
          filename="aRDP-personal-${safe_version}-${short_sha}-arm64-v8a.apk"

          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "application_id=$application_id" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "tag=personal-${safe_version}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Sign and verify APK
        id: signed
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APKSIGNER: ${{ steps.android-sdk.outputs.build_tools }}/apksigner
          OUTPUT_FILENAME: ${{ steps.unsigned.outputs.filename }}
          UNSIGNED_APK: ${{ steps.unsigned.outputs.apk }}
          ZIPALIGN: ${{ steps.android-sdk.outputs.build_tools }}/zipalign
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          keystore="$RUNNER_TEMP/ardp-release.jks"
          aligned_apk="$RUNNER_TEMP/ardp-aligned.apk"
          output_dir="$RUNNER_TEMP/ardp-output"
          mkdir -p "$output_dir"
          signed_apk="$output_dir/$OUTPUT_FILENAME"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$ZIPALIGN" -f -p 4 "$UNSIGNED_APK" "$aligned_apk"
          "$APKSIGNER" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$signed_apk" \
            "$aligned_apk"
          "$ZIPALIGN" -c -p 4 "$signed_apk"
          "$APKSIGNER" verify --verbose --print-certs "$signed_apk"

          sha256=$(sha256sum "$signed_apk" | awk '{print $1}')
          echo "apk=$signed_apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Write build summary
        env:
          APK_FILENAME: ${{ steps.unsigned.outputs.filename }}
          APK_SHA256: ${{ steps.signed.outputs.sha256 }}
          APPLICATION_ID: ${{ steps.unsigned.outputs.application_id }}
          SOURCE_KIND: ${{ steps.source.outputs.kind }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          VERSION_CODE: ${{ steps.unsigned.outputs.version_code }}
          VERSION_NAME: ${{ steps.unsigned.outputs.version_name }}
        shell: bash
        run: |
          {
            echo "## Personal aRDP build"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Application ID | \`$APPLICATION_ID\` |"
            echo "| Version name | \`$VERSION_NAME\` |"
            echo "| Version code | \`$VERSION_CODE\` |"
            echo "| Source commit | \`$SOURCE_SHA\` |"
            echo "| Source | $SOURCE_KIND |"
            echo "| APK | \`$APK_FILENAME\` |"
            echo "| SHA-256 | \`$APK_SHA256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed ARM64 APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.unsigned.outputs.filename }}
          path: ${{ steps.signed.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: steps.source.outputs.publish == 'true'
        env:
          APK: ${{ steps.signed.outputs.apk }}
          APK_FILENAME: ${{ steps.unsigned.outputs.filename }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_KIND: ${{ steps.source.outputs.kind }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          TAG: ${{ steps.unsigned.outputs.tag }}
          VERSION_NAME: ${{ steps.unsigned.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "Personal aRDP build from the GPL source; this is not an official upstream binary."
            echo
            echo "- Upstream/application version: \`$VERSION_NAME\`"
            echo "- Full source commit: \`$SOURCE_SHA\`"
            echo "- Source: $SOURCE_KIND"
          } > "$notes"

          gh release create "$TAG" \
            "$APK#$APK_FILENAME" \
            --target "$SOURCE_SHA" \
            --title "Personal aRDP $VERSION_NAME ($SOURCE_SHA)" \
            --notes-file "$notes"
