name: Sync upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.rebase.outputs.changed }}
      source_sha: ${{ steps.rebase.outputs.source_sha }}

    steps:
      - name: Check out fork default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Fetch and rebase onto upstream/master
        id: rebase
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          old_head=$(git rev-parse HEAD)
          git remote add upstream https://github.com/iiordanov/remote-desktop-clients.git
          git fetch --no-tags upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "No upstream commits need to be rebased."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git rebase upstream/master; then
            conflicts=$(git diff --name-only --diff-filter=U)
            git rebase --abort
            echo "::error::Automatic upstream rebase conflicted. Resolve the listed files manually and rerun this workflow."
            printf '%s\n' "$conflicts"
            {
              echo "## Upstream rebase conflict"
              echo
              echo "The workflow did not push or overwrite the fork branch. Resolve these files manually:"
              echo '```'
              printf '%s\n' "$conflicts"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          git push \
            --force-with-lease="refs/heads/$DEFAULT_BRANCH:$old_head" \
            origin "HEAD:$DEFAULT_BRANCH"
          source_sha=$(git rev-parse HEAD)
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          {
            echo "## Upstream sync completed"
            echo
            echo "Rebased \`$DEFAULT_BRANCH\` onto \`upstream/master\` at \`$source_sha\`."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/build-ardp.yml
    with:
      source_sha: ${{ needs.sync.outputs.source_sha }}
      source_kind: automated upstream sync
    secrets: inherit
